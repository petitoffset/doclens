[project]
name = "doclens-backend"
version = "0.1.0"
description = "Backend for the DocLens RAG assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.0,<2",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "sentence-transformers>=3.0,<6",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.uv]
package = false
